name: Foundation
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.rumdl.toml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
concurrency:
  # The successful-ancestor planner carries every cancelled push forward.
  # Explicit manual runs retain an independent complete validation request.
  group: foundation-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.impact.outputs.packages }}
      plan: ${{ steps.impact.outputs.plan }}
      windows: ${{ steps.impact.outputs.windows }}
      overlay: ${{ steps.impact.outputs.overlay }}
      mutations: ${{ steps.impact.outputs.mutations }}
      release: ${{ steps.impact.outputs.release }}
      conformance: ${{ steps.impact.outputs.conformance }}
      codec: ${{ steps.impact.outputs.codec }}
      package: ${{ steps.impact.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify affected-crate selection and aggregate-gate contracts
        shell: bash
        run: python3 -B -m unittest discover -s .github/ci -p 'test_*.py'
      - name: Select affected crates and validation groups
        id: impact
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/ci/impact.py --before "$BEFORE" --after "$GITHUB_SHA" --workflow foundation.yml
  windows:
    name: windows / ${{ matrix.target }} / ${{ matrix.lane }}
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.windows == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Start expensive test compilation first. Unit/doc/default binaries and
        # release receipts belong to correctness-0; every integration test is
        # assigned exactly once by Cargo metadata, independently of file names.
        lane: [correctness-0, correctness-1, correctness-2, correctness-3, checks, variants]
        runner: [windows-11-arm, windows-2025]
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      PRISM_PACKAGES: ${{ needs.changes.outputs.packages }}
      PRISM_RELEASE: ${{ needs.changes.outputs.release }}
      PRISM_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the exact bundled package version
        if: matrix.lane == 'correctness-0' && needs.changes.outputs.release == 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/release_version.py') | Out-String).Trim()
          "PRISM_VERSION=$version" >> $env:GITHUB_ENV
      - name: Reuse the exact native Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-${{ matrix.target }}
      - name: Identify the host and external build lane
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = rustc "+nightly-2026-11-09-$env:EXPECTED_TARGET" -vV
          if ($identity -notcontains "host: $env:EXPECTED_TARGET") { throw 'Expected the native target compiler.' }
          $identity
          "PRISM_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'PrismInference-Target')" >> $env:GITHUB_ENV
          "PRISM_CHECK_EVIDENCE=$(Join-Path $env:RUNNER_TEMP ('PrismInference-Checks-' + [guid]::NewGuid().ToString('N')))" >> $env:GITHUB_ENV
      - name: Reuse locked Cargo downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: prism-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Reuse this lane's compiler artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Never seed every shard with the old full-workspace target: retaining
          # only its own outputs keeps restore time and cache quota bounded.
          path: ${{ env.CARGO_TARGET_DIR }}
          key: prism-runtime-v2-${{ matrix.target }}-${{ matrix.lane }}-${{ env.PRISM_CACHE_HOST }}-nightly-2026-11-09-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'src/**', 'server/**', 'tools/**', 'tests/**', 'scripts/**', '.github/ci/foundation_shards.py', 'rustfmt.toml', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            prism-runtime-v2-${{ matrix.target }}-${{ matrix.lane }}-${{ env.PRISM_CACHE_HOST }}-nightly-2026-11-09-
      - name: Fetch the locked workspace and prepare evidence
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $packages = @($env:PRISM_PACKAGES | ConvertFrom-Json)
          if (-not $packages.Count) { throw 'A selected Windows lane requires affected packages.' }
          [void][IO.Directory]::CreateDirectory($env:PRISM_CHECK_EVIDENCE)
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo fetch' -- cargo +nightly-2026-11-09 fetch --manifest-path $manifest --locked
      - name: Save locked downloads once per architecture
        if: matrix.lane == 'correctness-0' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check affected Rust formatting, Clippy and documentation
        if: matrix.lane == 'checks'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $packages = @($env:PRISM_PACKAGES | ConvertFrom-Json)
          $selection = @($packages | ForEach-Object { '--package'; $_ })
          Start-Transcript -LiteralPath (Join-Path $env:PRISM_CHECK_EVIDENCE 'workspace.log') | Out-Null
          try {
            python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo fmt' -- cargo +nightly-2026-11-09 fmt --manifest-path $manifest @selection -- --check
            # Native linking is covered separately by the selected overlay gate.
            python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo clippy' -- cargo +nightly-2026-11-09 clippy --manifest-path $manifest @selection --all-targets --locked --offline --release -- -D warnings
            python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo doc' -- cargo +nightly-2026-11-09 doc --manifest-path $manifest @selection --no-deps --locked --offline --release
          } finally { Stop-Transcript | Out-Null }
      - name: Run this shard's complete Cargo correctness targets
        if: startsWith(matrix.lane, 'correctness-')
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $index = [int]($env:PRISM_LANE -replace '^correctness-', '')
          Start-Transcript -LiteralPath (Join-Path $env:PRISM_CHECK_EVIDENCE 'correctness.log') | Out-Null
          try {
            python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/foundation_shards.py') --index $index --count 4 --manifest (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --evidence $env:PRISM_CHECK_EVIDENCE
          } finally { Stop-Transcript | Out-Null }
      - name: Build selected default-feature executables
        if: matrix.lane == 'correctness-0'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $packages = @($env:PRISM_PACKAGES | ConvertFrom-Json)
          Start-Transcript -LiteralPath (Join-Path $env:PRISM_CHECK_EVIDENCE 'build.log') | Out-Null
          try {
            $binaryPackages = @('prism-inference','prism-inference-server','bonsai-gguf','prism-conformance-policy','bonsai-codec-probe')
            $buildPackages = @($binaryPackages | Where-Object { $_ -cin $packages })
            $buildFeatures = @()
            if ($env:PRISM_RELEASE -ceq 'true') {
              & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-ReleaseBundle.ps1') -Case All
              $buildPackages = @($buildPackages + @('prism-inference','prism-inference-server','bonsai-gguf') | Sort-Object -Unique)
              # Availability is part of these checked source-bound binary bytes.
              # Every runtime entry point still defaults to one row worker.
              $buildFeatures = @('--features', 'prism-inference/parallel-rows,prism-inference-server/parallel-rows')
            }
            if ($buildPackages.Count) {
              $buildSelection = @($buildPackages | ForEach-Object { '--package'; $_ })
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo build' -- cargo +nightly-2026-11-09 build --manifest-path $manifest @buildSelection @buildFeatures --bins --locked --offline --release
            }
          } finally { Stop-Transcript | Out-Null }
      - name: Check feature variants, scalar fallback and loader ABI
        if: matrix.lane == 'variants'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $packages = @($env:PRISM_PACKAGES | ConvertFrom-Json)
          Start-Transcript -LiteralPath (Join-Path $env:PRISM_CHECK_EVIDENCE 'feature-variants.log') | Out-Null
          try {
            if ('prism-inference' -cin $packages) {
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo build' -- cargo +nightly-2026-11-09 build --manifest-path $manifest -p prism-inference --locked --offline --release --no-default-features --lib
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo build' -- cargo +nightly-2026-11-09 build --manifest-path $manifest -p prism-inference --locked --offline --release --no-default-features --features experimental-neon --lib
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo clippy' -- cargo +nightly-2026-11-09 clippy --manifest-path $manifest -p prism-inference --locked --offline --release --no-default-features --all-targets -- -D warnings
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --no-default-features --test simd simd_
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo clippy' -- cargo +nightly-2026-11-09 clippy --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --all-targets -- -D warnings
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --lib kernels::packed_pq2::
              if ($env:CARGO_BUILD_TARGET -ceq 'aarch64-pc-windows-msvc') {
                python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --lib kernels::neon::tests::simd_neon_packed_consumption_
              }
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --lib kernels::parallel_rows::tests::
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --example swift_model_check tests::row_worker_prefix_is_bounded_and_composes_with_exact_profile_selection -- --exact
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --test parallel_rows
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference --locked --offline --release --features parallel-rows --test graph graph_parallel_rows_preserve_logits_checkpoints_and_recovery -- --exact
            }
            if ('prism-inference-server' -cin $packages) {
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo clippy' -- cargo +nightly-2026-11-09 clippy --manifest-path $manifest -p prism-inference-server --locked --offline --release --features parallel-rows --all-targets -- -D warnings
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference-server --locked --offline --release --features parallel-rows --lib native_child::tests::
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo test' -- cargo +nightly-2026-11-09 test --manifest-path $manifest -p prism-inference-server --locked --offline --release --features parallel-rows --lib native_backend::tests::private_readiness_reports_engine_worker_budget_and_rejects_invalid_counts -- --exact
            }
            if ('bonsai-gguf' -cin $packages) {
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo build' -- cargo +nightly-2026-11-09 build --manifest-path $manifest -p bonsai-gguf --locked --offline --release --no-default-features --lib
            }
            if ('bonsai-prism' -cin $packages) {
              # Check the loader ABI without enabling the native-tests link feature.
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo clippy' -- cargo +nightly-2026-11-09 clippy --manifest-path $manifest -p bonsai-prism --locked --offline --release --features engine-loader --all-targets -- -D warnings
              python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo doc' -- cargo +nightly-2026-11-09 doc --manifest-path $manifest -p bonsai-prism --locked --offline --release --features engine-loader --no-deps
            }
          } finally { Stop-Transcript | Out-Null }
      - name: Verify immutable reference fixtures and kill the bounded mutation catalog
        if: matrix.lane == 'correctness-0' && matrix.target == 'aarch64-pc-windows-msvc' && needs.changes.outputs.mutations == 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixtures = Join-Path $env:GITHUB_WORKSPACE 'tools/ternary/tests/fixtures'
          $provenance = Get-Content -LiteralPath (Join-Path $fixtures 'provenance.json') -Raw | ConvertFrom-Json -DateKind String
          if ((Get-FileHash -LiteralPath (Join-Path $fixtures 'ptq-reference.bin') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $provenance.fixtureSha256) { throw 'The immutable C++ codec corpus differs from its provenance.' }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Mutations.ps1') -EvidenceDirectory (Join-Path $env:PRISM_CHECK_EVIDENCE 'mutations')
      - name: Package the five checked Windows executables
        if: matrix.lane == 'correctness-0' && needs.changes.outputs.release == 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $build = Join-Path $env:CARGO_TARGET_DIR "$env:RELEASE_TARGET/release"
          foreach ($name in @('prism-inference','bonsai-token-worker','bonsai-swift-worker','prism-inference-server','bonsai-gguf')) {
            & (Join-Path $build ($name + '.exe')) --help
          }
          $output = Join-Path $env:RUNNER_TEMP ('PrismInference-Bundle-' + [guid]::NewGuid().ToString('N'))
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/New-ReleaseBundle.ps1') -BuildDirectory $build -OutputDirectory $output -Target $env:RELEASE_TARGET -SourceRevision $env:GITHUB_SHA -Version $env:PRISM_VERSION -Toolchain "nightly-2026-11-09-$env:RELEASE_TARGET" | ConvertTo-Json -Depth 8
          "PRISM_BUNDLE_DIRECTORY=$output" >> $env:GITHUB_ENV
      - name: Retain the checked release bundle and source receipt
        if: matrix.lane == 'correctness-0' && needs.changes.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-inference-${{ env.PRISM_VERSION }}-${{ matrix.target }}
          path: |
            ${{ env.PRISM_BUNDLE_DIRECTORY }}/*.zip
            ${{ env.PRISM_BUNDLE_DIRECTORY }}/*.receipt.json
          if-no-files-found: error
      - name: Retain correctness and analyzer logs
        if: always() && env.PRISM_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-checks-${{ matrix.target }}-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ env.PRISM_CHECK_EVIDENCE }}
          if-no-files-found: error
  native-overlay:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned Linux ARM64 Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-unknown-linux-gnu
      - name: Identify native Rust for the storage policy and regression
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustc +nightly-2026-11-09 -vV
      - name: Select the ccache installation identity
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          "PRISM_PACKAGE_HOST=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_ENV
      - name: Reuse ccache installation packages for this runner image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-CcachePackages/*.deb
          # Dependencies already installed by the image must match on a hit.
          # Never restore these system packages across runner image versions.
          key: prism-ccache-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_PACKAGE_HOST }}
      - name: Install ccache and select the native compiler cache identity
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command ccache -CommandType Application -ErrorAction SilentlyContinue)) {
            $packageDirectory = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CcachePackages'
            [void][IO.Directory]::CreateDirectory($packageDirectory)
            $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.deb' -File | ForEach-Object { $_.FullName })
            if (-not $packages.Count) {
              sudo apt-get update -qq
              sudo apt-get --download-only -y --no-install-recommends -o "Dir::Cache::archives=$packageDirectory" install ccache
              $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.deb' -File | ForEach-Object { $_.FullName })
            }
            if (-not $packages.Count) { throw 'The ccache installation packages are missing.' }
            sudo dpkg --install @packages
          }
          $compiler = clang++ --version | Out-String
          $ccache = ccache --version | Out-String
          $identity = "$env:ImageOS-$env:ImageVersion-$compiler-$ccache"
          $digest = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity)))
          "PRISM_CACHE_HOST=$digest" >> $env:GITHUB_ENV
      # Keep native and Rust caches separate: changing Cargo paths must not
      # invalidate every C++ object through the Actions cache path version.
      - name: Reuse pinned source downloads and compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/SwiftBonsai-PrismDownloads
            ${{ runner.temp }}/SwiftBonsai-PrismCcache
          key: prism-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-${{ hashFiles('tools/prism/**', 'scripts/Build-PrismEngine.ps1') }}
          restore-keys: |
            prism-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-
      - name: Reuse locked Prism Rust downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/SwiftBonsai-PrismRustChecks
            ${{ runner.temp }}/SwiftBonsai-PrismRustBuild
          key: prism-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-nightly-2026-11-09-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/prism/**', 'scripts/Build-PrismEngine.ps1', 'scripts/Bonsai.Rust.psm1', 'tests/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            prism-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-nightly-2026-11-09-
      - name: Check Rust and build the pinned engine with its Rust storage overlay
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: ${{ runner.temp }}/SwiftBonsai-PrismCcache
          CCACHE_MAXSIZE: 500M
          CCACHE_COMPILERCHECK: content
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected native ARM64 source build.' }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'tools/prism/Cargo.toml'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismRustChecks'
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo fetch' -- cargo +nightly-2026-11-09 fetch --manifest-path $manifest --locked
          $checks = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-PrismChecks-' + [guid]::NewGuid().ToString('N'))
          "PRISM_CHECK_EVIDENCE=$checks" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-prism -Toolchain nightly-2026-11-09 -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory (Join-Path $checks 'policy') -FullTests -Offline | ConvertTo-Json -Depth 8
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1') -Force
          $lock = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools/prism/source.lock.json') | ConvertFrom-Json
          $lane = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismDownloads'
          [IO.Directory]::CreateDirectory($lane) | Out-Null
          $archive = Join-Path $lane ("prism-source-$($lock.ArchiveSha256).zip")
          $null = Receive-LockedArtifact -Uri $lock.ArchiveUrl -Path $archive -Bytes $lock.ArchiveBytes -Sha256 $lock.ArchiveSha256 -TimeoutSeconds 600
          $rustBuild = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismRustBuild'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismOverlay.ps1') -SourceArchive $archive -RustTargetDirectory $rustBuild
          $launcher = (Get-Command ccache -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $parallel = [Math]::Min(4, [Environment]::ProcessorCount)
          ccache --zero-stats
          $result = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-PrismEngine.ps1') -SourceArchive $archive -BuildMode All -Generator Ninja -Parallel $parallel -CompilerLauncher $launcher -RustTargetDirectory $rustBuild
          $result | ConvertTo-Json -Depth 10
          "BONSAI_PRISM_EVIDENCE=$($result.EvidenceDirectory)" >> $env:GITHUB_ENV
          ctest --test-dir (Join-Path $result.EvidenceDirectory 'build-probe') --output-on-failure --timeout 60
          if ($LASTEXITCODE) { throw 'Native immutable B-sharing regression failed.' }
          $nativeLibraries = @(Get-ChildItem -LiteralPath (Join-Path $result.EvidenceDirectory 'build-probe') -Recurse -File | Where-Object { $_.Name -in @('libggml.a','libggml-cpu.a','libggml-base.a') })
          $env:BONSAI_PRISM_NATIVE_LIB_DIR = @($nativeLibraries.DirectoryName | Sort-Object -Unique) -join [IO.Path]::PathSeparator
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-prism -Toolchain nightly-2026-11-09 -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory (Join-Path $checks 'native') -CheckProfile Native -Phase clippy,doc -Offline | ConvertTo-Json -Depth 8
          ccache --show-stats
          'Rust sharing policy and native regression passed; pinned engine compiled and linked to Rust. Model TPS/quality remains unqualified.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain source-build receipts and technical logs
        if: always() && env.BONSAI_PRISM_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-storage-overlay-${{ github.run_id }}
          path: |
            ${{ env.BONSAI_PRISM_EVIDENCE }}/build-receipt.json
            ${{ env.BONSAI_PRISM_EVIDENCE }}/command-*.log
            ${{ env.BONSAI_PRISM_EVIDENCE }}/build-probe/Testing/Temporary/LastTest.log
          if-no-files-found: error
      - name: Retain Prism Rust check evidence
        if: always() && env.PRISM_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-rust-checks-${{ github.run_id }}
          path: ${{ env.PRISM_CHECK_EVIDENCE }}
          if-no-files-found: error

  rust-regression:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.conformance == 'true'
    needs: changes
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-pc-windows-msvc
      - name: Identify native regression build storage
        shell: pwsh
        run: |
          if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Runtime regression requires native Windows ARM64.' }
          "PRISM_REGRESSION_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'Prism-RuntimeRegressionTarget')" >> $env:GITHUB_ENV
      - name: Reuse the bounded regression compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ env.CARGO_TARGET_DIR }}
          key: prism-regression-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_REGRESSION_HOST }}-nightly-2026-11-09-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'src/**', 'tools/ternary/**', 'tools/gguf/**', 'tools/native-hash/**', 'tools/prism/**', 'tests/upstream_prism/**', 'tests/fixtures/**') }}-content-v1
          restore-keys: |
            prism-regression-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_REGRESSION_HOST }}-nightly-2026-11-09-
      - name: Build this revision's Rust source assertion harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo build' -- cargo +nightly-2026-11-09-aarch64-pc-windows-msvc build --locked --release --package prism-inference --example upstream_prism
      - name: Require every selected runtime regression
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/runtime_regression.py') --harness (Join-Path $env:CARGO_TARGET_DIR 'release/examples/upstream_prism.exe') --evidence (Join-Path $env:RUNNER_TEMP 'Prism-RuntimeRegression')
      - name: Retain compact regression results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-runtime-regression-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/Prism-RuntimeRegression
          if-no-files-found: error
          retention-days: 7
  codec-native:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.codec == 'true'
    needs: changes
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-pc-windows-msvc
      - name: Reuse the immutable released runtime archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Prism-CodecDownloads
          key: prism-codec-download-v1-${{ runner.os }}-${{ hashFiles('tools/codec-probe/native.lock.json') }}
      - name: Reuse native codec probe compiler artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/Prism-CodecTarget
          key: prism-codec-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/codec-probe/**', 'tools/ternary/**', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            prism-codec-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the probe and consume every preserved synthetic native codec input
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Native codec acceptance requires Windows ARM64.' }
          $checks = Join-Path $env:RUNNER_TEMP ('Prism-CodecChecks-' + [guid]::NewGuid().ToString('N'))
          "PRISM_CODEC_EVIDENCE=$checks" >> $env:GITHUB_ENV
          [void][IO.Directory]::CreateDirectory($checks)
          $target = Join-Path $env:RUNNER_TEMP 'Prism-CodecTarget'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          Start-Transcript -LiteralPath (Join-Path $checks 'codec-workflow.log') | Out-Null
          try {
            python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Foundation Cargo fetch' -- cargo +nightly-2026-11-09-aarch64-pc-windows-msvc fetch --manifest-path $manifest --locked
            & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-codec-probe -Phase build -TargetDirectory $target -EvidenceDirectory (Join-Path $checks 'rust') -Offline | ConvertTo-Json -Depth 8
            Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1')
            $lock = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools/codec-probe/native.lock.json') -Raw | ConvertFrom-Json
            $downloads = Join-Path $env:RUNNER_TEMP 'Prism-CodecDownloads'
            [void][IO.Directory]::CreateDirectory($downloads)
            $archive = Join-Path $downloads $lock.Runtime.asset.filename
            $null = Receive-LockedArtifact -Uri $lock.Runtime.asset.url -Path $archive -Bytes $lock.Runtime.asset.bytes -Sha256 $lock.Runtime.asset.sha256 -TimeoutSeconds 600
            & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismCodec.ps1') -RuntimeArchive $archive -ProbeToolPath (Join-Path $target 'release/bonsai-codec-probe.exe') -EvidenceDirectory (Join-Path $checks 'native')
          } finally { Stop-Transcript | Out-Null }
      - name: Retain codec corpus, ABI, package and process receipts
        if: always() && env.PRISM_CODEC_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-native-codec-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.PRISM_CODEC_EVIDENCE }}/*.log
            ${{ env.PRISM_CODEC_EVIDENCE }}/rust
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.json
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.log
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.stdout
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.stderr
          if-no-files-found: error
  source-package:
    name: package / ${{ matrix.target }}
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.package == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select external build and evidence directories
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'Prism-SourcePackage-Build')" >> $env:GITHUB_ENV
          "PRISM_PACKAGE_EVIDENCE=$(Join-Path $env:RUNNER_TEMP 'Prism-SourcePackage-Evidence')" >> $env:GITHUB_ENV
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-${{ matrix.target }}
          components: ''
      - name: Reuse locked Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: prism-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Verify normalized packages and an external library consumer
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python (Join-Path $env:GITHUB_WORKSPACE '.github/ci/source_package.py')
      - name: Retain source archives and consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/package/*.crate
            ${{ env.PRISM_PACKAGE_EVIDENCE }}/receipt.json
            ${{ env.PRISM_PACKAGE_EVIDENCE }}/commands.json
            ${{ env.PRISM_PACKAGE_EVIDENCE }}/consumer/Cargo.lock
          if-no-files-found: error

  foundation:
    if: always() && github.ref == 'refs/heads/main'
    needs: [changes, windows, native-overlay, rust-regression, codec-native, source-package]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected validation group
        shell: bash
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/ci/gate.py --workflow foundation
