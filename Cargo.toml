[package]
name = "prism-inference"
default-run = "prism-inference"
version = "0.1.27"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded Rust CPU inference and tokenization for Prism-compatible GGUF models"
repository.workspace = true
readme = "README.md"
keywords = ["inference", "gguf", "prism", "ternary", "qwen35"]
categories = ["science", "command-line-utilities"]

[lib]
# Preserve the existing Rust import path for first-release API compatibility.
name = "bonsai_prism_runtime"

[features]
default = ["cli", "experimental-neon"]
cli = ["dep:serde", "dep:serde_json"]
experimental-neon = ["dep:fearless_simd", "dep:bonsai-neon-dot"]
parallel-rows = ["dep:rayon"]

[[bin]]
name = "prism-inference"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "bonsai-token-worker"
path = "src/bin/token_worker.rs"
# Protocol regressions launch the ordinary binary; the root has no unit tests.
test = false
required-features = ["cli"]

[[bin]]
name = "bonsai-swift-worker"
path = "src/bin/swift_worker.rs"
test = false
required-features = ["cli"]

[dependencies]
aho-corasick = "=1.1.5"
rayon = { version = "=1.12.0", optional = true }
bonsai-ternary = { version = "=0.1.3", path = "tools/ternary" }
bonsai-gguf = { version = "=0.1.5", path = "tools/gguf", default-features = false }
bonsai-prism = { version = "=0.1.5", path = "tools/prism" }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
regex = "=1.13.1"
fancy-regex = "=0.20.2"
unicode-normalization-alignments = "=0.1.12"
bonsai-native-hash = { version = "=0.1.3", path = "tools/native-hash" }

[target.'cfg(all(target_arch = "aarch64", target_os = "windows", target_env = "msvc"))'.dependencies]
fearless_simd = { version = "=1.2.0", optional = true }
bonsai-neon-dot = { version = "=0.1.3", path = "tools/neon-dot", optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# Independent Rust tokenizer references; native regex and C++ training are disabled.
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
sentencepiece-rs = { version = "=0.2.2", default-features = false }

[[test]]
name = "jinja_capabilities"
path = "tests/jinja_capabilities.rs"
required-features = ["cli"]

[[example]]
name = "swift_model_check"
# Include bounded evidence-write guards in ordinary correctness checks.
test = true
required-features = ["cli"]

[[example]]
name = "ffn_probe"
path = "examples/ffn_patch_probe.rs"
test = true
required-features = ["cli"]

[[example]]
name = "cpu_bundle_check"
test = true
required-features = ["cli", "parallel-rows"]

[[example]]
name = "cpu_candidate_check"
test = true
required-features = ["cli", "parallel-rows"]

[[example]]
name = "swift_sanity_check"
test = true
required-features = ["cli", "parallel-rows"]

[[example]]
name = "upstream_prism"
# Conformance code lives with tests; the explicit example target preserves
# its command-line runner and embedded unit tests.
path = "tests/upstream_prism/harness.rs"
test = true
required-features = ["cli"]

[profile.release]
overflow-checks = true
debug-assertions = false

[profile.test]
overflow-checks = true
debug-assertions = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["tools/ternary", "tools/neon-dot", "tools/gguf", "tools/native-hash", "tools/prism", "server", "tools/conformance-policy", "tools/codec-probe", "tools/rust-trial", "tools/hexagon-native", "tools/hexagon-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The pinned nightly provides Polonius lending and the next-generation trait solver.
rust-version = "1.101"
license = "Apache-2.0"
repository = "https://github.com/symbiogenesis/prism-inference"

[workspace.dependencies]
bonsai-windows-process = "=0.1.2"
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
windows-sys = "=0.61.2"


[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(cpu_bundle_legacy_f16)'] }
unsafe_code = "deny"
non_ascii_idents = "forbid"
# Native-boundary unsafe allowances must never waive these safety checks.
unsafe_op_in_unsafe_fn = "forbid"
invalid_reference_casting = "forbid"
static_mut_refs = "forbid"
ffi_unwind_calls = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
unused_import_braces = "deny"
meta_variable_misuse = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
as_conversions = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
