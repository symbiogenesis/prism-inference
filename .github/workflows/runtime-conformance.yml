      - name: Reuse exact pinned upstream native builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-PrismUpstreamNative
          # Orchestration changes can reuse the same native source/compiler tree.
          # Never restore across source pins, adapter code or compiler identities;
          # source verification and CMake still run before every correctness test.
