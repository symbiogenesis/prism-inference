name: Experimental native Hexagon boundary
on:
  push:
    branches: [main, 'codex/hexagon-**']
    paths:
      - tools/hexagon-native/**
      - tools/hexagon-runtime/**
      - src/graph.rs
      - src/lib.rs
      - src/runtime.rs
      - src/graph/projection.rs
      - src/kernels.rs
      - src/kernels/projection.rs
      - tests/graph.rs
      - tests/graph/projection.rs
      - tests/graph/admission.rs
      - config/rust-packages.psd1
      - .github/workflows/hexagon-native.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - rustfmt.toml
      - .cargo/**
      - .github/actions/rust-toolchain/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-native-arm64:
    name: Native ARM64 cross-target lint / Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-x86_64-unknown-linux-gnu
          components: clippy
      - name: Type-check the native Windows ARM64 boundary without linking or execution
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          toolchain=nightly-2026-11-09-x86_64-unknown-linux-gnu
          rustup target add --toolchain "$toolchain" aarch64-pc-windows-msvc
          # This reaches the real Windows ARM64 cfg and private FFI code while
          # requiring neither an ARM64 linker nor a vendor driver. It cannot
          # replace the independent Windows ARM64 test/doc/device gates below.
          cargo "+$toolchain" check --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --target-dir "$RUNNER_TEMP/Prism-Hexagon-Cross-Target" --locked --release -p bonsai-hexagon-native --all-targets
          cargo "+$toolchain" clippy --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --target-dir "$RUNNER_TEMP/Prism-Hexagon-Cross-Target" --locked --release -p bonsai-hexagon-native --all-targets -- -D warnings
  native-contracts:
    name: Native contracts / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-${{ matrix.target }}
      - name: Check the isolated unpublished crate without opening a device
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'Prism-Hexagon-Native-Target'
          $toolchain = 'nightly-2026-11-09-' + $env:CARGO_BUILD_TARGET
          cargo "+$toolchain" fmt --manifest-path $manifest -p bonsai-hexagon-native -- --check
          cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --all-targets
          cargo "+$toolchain" clippy --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --all-targets -- -D warnings
          cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --doc
          cargo "+$toolchain" doc --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --no-deps
      - name: Check exact projection executors and native graph integration without a device
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'Prism-Hexagon-Runtime-Target'
          $toolchain = 'nightly-2026-11-09-' + $env:CARGO_BUILD_TARGET
          cargo "+$toolchain" fmt --manifest-path $manifest -p prism-inference -p bonsai-hexagon-runtime -- --check
          cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-runtime --all-targets
          cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p prism-inference --test graph projection_scope
          cargo "+$toolchain" clippy --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-runtime --all-targets -- -D warnings
          cargo "+$toolchain" doc --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-runtime --no-deps
