name: Experimental native Hexagon boundary
on:
  push:
    branches: ['codex/hexagon-**']
    paths:
      - tools/hexagon-native/**
      - .github/workflows/hexagon-native.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contracts:
    name: Native contracts / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-${{ matrix.target }}
      - name: Check the isolated unpublished crate without opening a device
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'Prism-Hexagon-Native-Target'
          $toolchain = 'nightly-2026-10-22-' + $env:CARGO_BUILD_TARGET
          cargo "+$toolchain" fmt --manifest-path $manifest -p bonsai-hexagon-native -- --check
          cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --all-targets
          cargo "+$toolchain" clippy --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --all-targets -- -D warnings
          cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --doc
          cargo "+$toolchain" doc --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --no-deps
