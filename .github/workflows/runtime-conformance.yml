            ${{ env.PRISM_CODEC_EVIDENCE }}/rust
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.json
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.log
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.stdout
            ${{ env.PRISM_CODEC_EVIDENCE }}/native/*.stderr
          if-no-files-found: error

  runtime-conformance:
    if: always() && github.ref == 'refs/heads/main'
    needs: [changes, prism-upstream, prism-upstream-grammar, prism-backend-tools, prism-backend-plan, prism-backend-join-plan, prism-backend-run, prism-upstream-gate, codec-native]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected validation group
        shell: bash
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/ci/gate.py --workflow runtime-conformance
