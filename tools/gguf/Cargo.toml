[package]
name = "bonsai-gguf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
description = "Bounded GGUF inspection, pinned PQ2 census and exact PTQ1 export"
repository.workspace = true
keywords = ["ternary", "quantization", "scalar"]
categories = ["encoding", "science"]

[features]
default = ["report"]
report = ["dep:serde_json", "dep:bonsai-ternary"]

[lib]
test = false

[[bin]]
name = "bonsai-gguf"
path = "src/main.rs"
required-features = ["report"]

[dependencies]
bonsai-ternary = { path = "../ternary", version = "=0.1.0", optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true

[lints]
workspace = true
