[package]
name = "prism-inference-server"
version = "0.1.23"
edition.workspace = true
rust-version.workspace = true
# Unpublished Hexagon path dependencies below are retained for GitHub binaries/source checkouts.
publish = false
license.workspace = true
repository.workspace = true
description = "Bounded private HTTP server for Prism CPU inference"
keywords = ["inference", "prism", "gguf"]
categories = ["science"]

[features]
parallel-rows = ["bonsai-prism-runtime/parallel-rows"]

[[example]]
name = "private_service_check"
test = true


[dependencies]
bonsai-prism-runtime = { package = "prism-inference", path = "..", version = "=0.1.23" }
httparse = "=1.10.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["io-util", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
bonsai-windows-process.workspace = true
bonsai-windows-credentials = "=0.1.4"

[target.'cfg(all(target_arch = "aarch64", target_os = "windows", target_env = "msvc"))'.dependencies]
bonsai-hexagon-native = { path = "../tools/hexagon-native" }
bonsai-hexagon-runtime = { path = "../tools/hexagon-runtime" }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[lints]
workspace = true
