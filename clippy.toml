# The pinned bonsai-windows-process 0.1.2 containment boundary uses mxc-sdk 1.0.1,
# whose winreg 0.55.0 requires windows-sys 0.59.0. Native hashing and other current
# Windows consumers require 0.61.2. These incompatible requirements cannot be
# unified without changing a reviewed dependency boundary.
#
# serde_derive 1.0.229 requires syn 3, while the same pinned containment route's
# windows-core 0.62.2 uses windows-implement 0.60.2 and windows-interface 0.59.3,
# both requiring syn 2.0. Their incompatible major requirements cannot unify
# without changing reviewed dependency pins. Permit only these two named
# duplicates; retain every other multiple-crate-versions diagnostic.
allowed-duplicate-crates = ["windows-sys", "syn"]
