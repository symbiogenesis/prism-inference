[package]
name = "bonsai-gguf"
version = "0.1.11"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
description = "Bounded GGUF inspection, pinned PQ2 census and exact PTQ1 export"
repository.workspace = true
keywords = ["ternary", "quantization", "scalar"]
categories = ["encoding", "science"]

[features]
default = ["report"]
report = ["dep:serde_json", "dep:bonsai-ternary"]

[lib]
test = false

[[bin]]
name = "bonsai-gguf"
path = "src/main.rs"
required-features = ["report"]

[dependencies]
bonsai-native-hash.workspace = true
bonsai-ternary = { workspace = true, optional = true }
hex.workspace = true
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
