name: Rust compiler acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tools/rust-trial/fixtures/**'
      - 'config/rust-nightly-trial.json'
      - 'rust-toolchain.toml'
      - 'tests/Test-RustNightly.ps1'
      - 'scripts/Bonsai.Common.psm1'
      - 'scripts/Bonsai.Native.psm1'
      - '.github/actions/rust-toolchain/**'
      - '.github/workflows/rust-nightly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-nightly-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  probe:
    name: Compiler acceptance probes
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned native compilers and external evidence for metadata probes
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected a native ARM64 runner process.' }
          $evidence = Join-Path $env:RUNNER_TEMP ('Prism-RustProbe-' + [guid]::NewGuid().ToString('N'))
          if (-not [IO.Path]::IsPathFullyQualified($evidence) -or $evidence -match '%[^%]+%') { throw 'Expected an expanded absolute evidence path.' }
          [void][IO.Directory]::CreateDirectory($evidence)
          "RUST_TRIAL_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $configuration = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'config/rust-nightly-trial.json') | ConvertFrom-Json -DateKind String -NoEnumerate
          if ($configuration.SchemaVersion -ne 1) { throw 'Unsupported Rust trial configuration schema.' }
          "RUST_PROBE_STABLE_TOOLCHAIN=$($configuration.StableToolchain)" >> $env:GITHUB_ENV
          "RUST_PROBE_NIGHTLY_TOOLCHAIN=$($configuration.NightlyToolchain)" >> $env:GITHUB_ENV
      - name: Reuse the exact stable control compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ env.RUST_PROBE_STABLE_TOOLCHAIN }}
          components: ''
      - name: Reuse the exact production nightly compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ env.RUST_PROBE_NIGHTLY_TOOLCHAIN }}
          components: ''
      - name: Compare borrowing and trait-solver acceptance
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-RustNightly.ps1') -Mode Probe -FullTests -EvidenceDirectory (Join-Path $env:RUST_TRIAL_EVIDENCE 'probe')
      - name: Retain compiler identities, acceptance results and command logs
        if: always() && env.RUST_TRIAL_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nightly-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUST_TRIAL_EVIDENCE }}
          if-no-files-found: error
  compatibility:
    name: compatibility
    if: always() && github.ref == 'refs/heads/main'
    needs: probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require compiler acceptance probes
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          {
            printf '%s\n' \
              "Revision: $GITHUB_SHA" \
              "Compiler acceptance probes: $PROBE_RESULT" \
              '' \
              'The pinned nightly is the production toolchain; stable is an isolated compiler-probe control. Compiler acceptance and correctness do not establish inference performance gains.' \
              'Foundation owns workspace correctness and loader feature checks; this workflow only compares compiler acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PROBE_RESULT" != 'success' ]]; then
            echo 'Compiler acceptance probes must succeed; failed, cancelled or skipped jobs are not accepted.' >&2
            exit 1
          fi
