name: Foundation bundle
run-name: Foundation bundle / ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact main source commit selected for this operation
        type: string
        required: true
      operation_id:
        description: Unique short operation nonce for exact release-run identification
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: foundation-bundle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    steps:
      - name: Bind the operation and exact dispatched source
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_REVISION -cnotmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:EXPECTED_REVISION) {
            throw 'Dispatched source differs from the exact declared revision.'
          }
          if ($env:OPERATION_ID -cnotmatch '^[A-Za-z0-9][A-Za-z0-9_-]{0,47}$') {
            throw 'Operation ID must contain one to 48 safe letters, digits, underscores or hyphens.'
          }
          "PRISM_OPERATION_ID=$env:OPERATION_ID" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the package version and external build lane
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/release_version.py') | Out-String).Trim()
          "PRISM_VERSION=$version" >> $env:GITHUB_ENV
          "PRISM_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'PrismInference-Target')" >> $env:GITHUB_ENV
      - name: Reuse the exact native Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-pc-windows-msvc
      - name: Reuse locked Cargo downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: prism-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Reuse only the matching ARM64 correctness build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: prism-runtime-v2-aarch64-pc-windows-msvc-correctness-0-${{ env.PRISM_CACHE_HOST }}-nightly-2026-11-09-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'src/**', 'server/**', 'tools/**', 'tests/**', 'scripts/**', '.github/ci/foundation_shards.py', 'rustfmt.toml', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            prism-runtime-v2-aarch64-pc-windows-msvc-correctness-0-${{ env.PRISM_CACHE_HOST }}-nightly-2026-11-09-
      - name: Check final source policies and analyzers without the full correctness suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $versionControls = (python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/test_release_version.py') -v 2>&1 | Out-String)
          $versionControls | Write-Output
          if ($versionControls -notmatch '(?m)^Ran 3 tests in ' -or $versionControls -notmatch '(?m)^OK\r?$') {
            throw 'All three bundle-version controls must pass.'
          }
          $receiptControls = (python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/test_inference_efficiency.py') -v 2>&1 | Out-String)
          $receiptControls | Write-Output
          if ($receiptControls -notmatch '(?m)^Ran 6 tests in ' -or $receiptControls -notmatch '(?m)^OK\r?$') {
            throw 'All six inference-efficiency receipt controls must pass.'
          }
          $importControls = (python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/test_release_imports.py') -v 2>&1 | Out-String)
          $importControls | Write-Output
          if ($importControls -notmatch '(?m)^Ran 5 tests in ' -or $importControls -notmatch '(?m)^OK\r?$') {
            throw 'All five data-only PE import controls must pass.'
          }
          cargo +nightly-2026-11-09 fetch --manifest-path $manifest --locked
          cargo +nightly-2026-11-09 fmt --manifest-path $manifest --all -- --check
          cargo +nightly-2026-11-09 clippy --manifest-path $manifest --locked --offline --release -p prism-inference -p prism-inference-server -p bonsai-hexagon-native -p bonsai-hexagon-runtime --all-targets --features prism-inference/parallel-rows,prism-inference-server/parallel-rows -- -D warnings
          cargo +nightly-2026-11-09 check --manifest-path $manifest --locked --offline --release -p prism-inference --lib --no-default-features
      - name: Verify only the named static-runtime unwind and drain controls
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $panicOutput = (cargo +nightly-2026-11-09 test --manifest-path $manifest --locked --offline --release -p prism-inference --features parallel-rows --lib kernels::parallel_rows::tile::tests::tiled_parallel_rows_worker_panic_cannot_strand_caller -- --exact 2>&1 | Out-String)
          $drainOutput = (cargo +nightly-2026-11-09 test --manifest-path $manifest --locked --offline --release -p prism-inference --features parallel-rows --test backend_threadpool failed_worker_group_drains_before_the_plan_is_reused -- --exact 2>&1 | Out-String)
          foreach ($control in @(
            @{ Name = 'kernels::parallel_rows::tile::tests::tiled_parallel_rows_worker_panic_cannot_strand_caller'; Output = $panicOutput },
            @{ Name = 'failed_worker_group_drains_before_the_plan_is_reused'; Output = $drainOutput }
          )) {
            $control.Output | Write-Output
            $expected = '(?m)^test ' + [regex]::Escape($control.Name) + ' \.\.\. ok\r?$'
            $summary = '(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+'
            if ([regex]::Matches($control.Output, '(?m)^running 1 test\r?$').Count -ne 1 -or
                [regex]::Matches($control.Output, $expected).Count -ne 1 -or [regex]::Matches($control.Output, $summary).Count -ne 1) {
              throw "The exact static-runtime control did not pass once: $($control.Name)"
            }
          }
      - name: Build and package only the five release executables
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          cargo +nightly-2026-11-09 build --manifest-path $manifest -p prism-inference -p prism-inference-server -p bonsai-gguf --features prism-inference/parallel-rows,prism-inference-server/parallel-rows --bins --locked --offline --release
          $target = 'aarch64-pc-windows-msvc'
          $build = Join-Path $env:CARGO_TARGET_DIR "$target/release"
          foreach ($name in @('prism-inference','bonsai-token-worker','bonsai-swift-worker','prism-inference-server','bonsai-gguf')) {
            & (Join-Path $build ($name + '.exe')) --help
          }
          $output = Join-Path $env:RUNNER_TEMP ('PrismInference-ShortBundle-' + [guid]::NewGuid().ToString('N'))
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/New-ReleaseBundle.ps1') -BuildDirectory $build -OutputDirectory $output -Target $target -SourceRevision $env:GITHUB_SHA -Version $env:PRISM_VERSION -Toolchain "nightly-2026-11-09-$target" -RequireStaticRuntime | ConvertTo-Json -Depth 8
          [ordered]@{
            SchemaVersion = 1
            Kind = 'hosted-foundation-bundle-only'
            OperationId = $env:PRISM_OPERATION_ID
            SourceRevision = $env:GITHUB_SHA
            Version = $env:PRISM_VERSION
            Target = $target
            RunId = $env:GITHUB_RUN_ID
            RunAttempt = $env:GITHUB_RUN_ATTEMPT
            ReceiptControlsPassed = 9
            PeImportControlsPassed = 5
            StaticRuntimeUnwindControlsPassed = 2
            FinalSourceChecksPassed = $true
            ProductionLinkingPassed = $true
            ExternalVcRuntimeImportsAbsent = $true
            FullFoundationQualified = $false
            ModelAcceptanceQualified = $false
            PerformanceQualified = $false
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output 'bundle-scope.json') -Encoding utf8NoBOM
          "PRISM_BUNDLE_DIRECTORY=$output" >> $env:GITHUB_ENV
          'This hosted release build uses the GitHub job cap without a repository-imposed build deadline. It checks selected source policies, analyzers and portable compilation, then links and packages five executables. Full Foundation correctness, model acceptance and performance remain separate pending gates.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain the source-bound bundle and explicit limited scope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-inference-${{ env.PRISM_VERSION }}-aarch64-pc-windows-msvc
          path: |
            ${{ env.PRISM_BUNDLE_DIRECTORY }}/*.zip
            ${{ env.PRISM_BUNDLE_DIRECTORY }}/*.receipt.json
            ${{ env.PRISM_BUNDLE_DIRECTORY }}/bundle-scope.json
          if-no-files-found: error
