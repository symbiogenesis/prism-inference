name: Experimental native Hexagon boundary
on:
  push:
    branches: [main, 'codex/hexagon-**']
    paths:
      - tools/hexagon-native/**
      - tools/hexagon-runtime/**
      - src/graph.rs
      - src/lib.rs
      - src/runtime.rs
      - src/graph/projection.rs
      - src/kernels.rs
      - src/kernels/projection.rs
      - tests/graph.rs
      - tests/graph/projection.rs
      - tests/graph/admission.rs
      - config/rust-packages.psd1
      - .github/workflows/hexagon-native.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - rustfmt.toml
      - .cargo/**
      - .github/actions/rust-toolchain/**
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
jobs:
  cross-native-arm64:
    name: Native ARM64 cross-target lint / Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        id: rust
        with:
          toolchain: nightly-2026-11-09-x86_64-unknown-linux-gnu
          components: clippy
      - name: Reuse locked Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: prism-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Reuse only this cross-target compiler's build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Prism-Hexagon-Cross-Target
          key: prism-hexagon-v1-cross-${{ runner.os }}-${{ runner.arch }}-aarch64-pc-windows-msvc-${{ steps.rust.outputs.image-identity }}-${{ steps.rust.outputs.compiler-identity }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'clippy.toml', 'rustfmt.toml', '.cargo/**', 'src/**', 'tools/**', 'tests/**', 'server/**', '.github/workflows/hexagon-native.yml') }}-content-v1
          restore-keys: |
            prism-hexagon-v1-cross-${{ runner.os }}-${{ runner.arch }}-aarch64-pc-windows-msvc-${{ steps.rust.outputs.image-identity }}-${{ steps.rust.outputs.compiler-identity }}-
      - name: Type-check the native Windows ARM64 boundary without linking or execution
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          toolchain=nightly-2026-11-09-x86_64-unknown-linux-gnu
          rustup target add --toolchain "$toolchain" aarch64-pc-windows-msvc
          # This reaches the real Windows ARM64 cfg and private FFI code while
          # requiring neither an ARM64 linker nor a vendor driver. It cannot
          # replace the independent Windows ARM64 test/doc/device gates below.
          python -B "$GITHUB_WORKSPACE/.github/ci/run_ci_command.py" --label 'Hexagon Cargo check' -- cargo "+$toolchain" check --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --target-dir "$RUNNER_TEMP/Prism-Hexagon-Cross-Target" --locked --release -p bonsai-hexagon-native --all-targets
          python -B "$GITHUB_WORKSPACE/.github/ci/run_ci_command.py" --label 'Hexagon Cargo clippy' -- cargo "+$toolchain" clippy --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --target-dir "$RUNNER_TEMP/Prism-Hexagon-Cross-Target" --locked --release -p bonsai-hexagon-native --all-targets -- -D warnings
  native-contracts:
    name: Native contracts / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        id: rust
        with:
          toolchain: nightly-2026-11-09-${{ matrix.target }}
      - name: Reuse locked Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: prism-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Reuse only this native compiler's build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Both explicit package selections share dependency objects. Evidence
          # and command receipts remain fresh and are never restored here.
          path: ${{ runner.temp }}/Prism-Hexagon-Native-Target
          key: prism-hexagon-v1-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.image-identity }}-${{ steps.rust.outputs.compiler-identity }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'clippy.toml', 'rustfmt.toml', '.cargo/**', 'src/**', 'tools/**', 'tests/**', 'server/**', '.github/workflows/hexagon-native.yml') }}-content-v1
          restore-keys: |
            prism-hexagon-v1-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.image-identity }}-${{ steps.rust.outputs.compiler-identity }}-
      - name: Check the isolated unpublished crate without opening a device
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'Prism-Hexagon-Native-Target'
          $toolchain = 'nightly-2026-11-09-' + $env:CARGO_BUILD_TARGET
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo fmt' -- cargo "+$toolchain" fmt --manifest-path $manifest -p bonsai-hexagon-native -- --check
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo test' -- cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --all-targets
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo clippy' -- cargo "+$toolchain" clippy --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --all-targets -- -D warnings
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo test' -- cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --doc
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo doc' -- cargo "+$toolchain" doc --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-native --no-deps
      - name: Check exact projection executors and native graph integration without a device
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'Prism-Hexagon-Native-Target'
          $toolchain = 'nightly-2026-11-09-' + $env:CARGO_BUILD_TARGET
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo fmt' -- cargo "+$toolchain" fmt --manifest-path $manifest -p prism-inference -p bonsai-hexagon-runtime -- --check
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo test' -- cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-runtime --all-targets
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo test' -- cargo "+$toolchain" test --manifest-path $manifest --target-dir $target --locked --release -p prism-inference --test graph projection_scope
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo clippy' -- cargo "+$toolchain" clippy --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-runtime --all-targets -- -D warnings
          python -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/run_ci_command.py') --label 'Hexagon Cargo doc' -- cargo "+$toolchain" doc --manifest-path $manifest --target-dir $target --locked --release -p bonsai-hexagon-runtime --no-deps
